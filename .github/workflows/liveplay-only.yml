name: AIRCAT500 Mobile v4.01 LivePlay APK (v2.2 preserved)

on:
  push:
    branches: [feature/mobile-v4-01-sync2wifi]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: liveplay-v401-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-liveplay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify official v2.2 remains byte-for-byte preserved
        run: python3 tools/verify_v22_liveplay_only.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests and LivePlay parallel Android APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Package LivePlay APK (does not overwrite v2.2)
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AIRCAT500_V4.01_LivePlay_parallel.apk
          sha256sum AIRCAT500_V4.01_LivePlay_parallel.apk > AIRCAT500_V4.01_LivePlay_SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging AIRCAT500_V4.01_LivePlay_parallel.apk | head -n 4
          grep -q "name='gr.aircat.androidradaranalyzer.liveplay'" <("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging AIRCAT500_V4.01_LivePlay_parallel.apk)
          grep -q "versionName='4.01'" <("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging AIRCAT500_V4.01_LivePlay_parallel.apk)
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: AIRCAT500_V4.01_LivePlay_parallel_APK
          path: |
            AIRCAT500_V4.01_LivePlay_parallel.apk
            AIRCAT500_V4.01_LivePlay_SHA256SUMS.txt
      - name: Package full Android Studio project for LivePlay
        run: zip -qr AIRCAT500_V4.01_LivePlay_AndroidStudio.zip app build.gradle.kts settings.gradle.kts gradle.properties gradle .gitignore LIVEPLAY_PORT_GR.md tools
      - uses: actions/upload-artifact@v4
        with:
          name: AIRCAT500_V4.01_LivePlay_AndroidStudio
          path: AIRCAT500_V4.01_LivePlay_AndroidStudio.zip

  archive-v401:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/mobile-v4-01-sync2wifi'
    needs: android-liveplay
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: AIRCAT500_V4.01_LivePlay_parallel_APK
          path: /tmp/aircat-v401-apk
      - name: Archive verified v4.01 source and APK separately
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          dest=versions/v4.01
          if [ -e "$dest/apk/AIRCAT500_V4.01_LivePlay_parallel_APK.zip" ]; then echo "Archive already exists; refusing overwrite"; exit 1; fi
          mkdir -p "$dest/source" "$dest/apk"
          git fetch origin "$SOURCE_SHA"
          git archive "$SOURCE_SHA" | tar -x -C "$dest/source"
          cp /tmp/aircat-v401-apk/* "$dest/apk/"
          (cd "$dest/apk"; sha256sum --check AIRCAT500_V4.01_LivePlay_SHA256SUMS.txt; zip -q AIRCAT500_V4.01_LivePlay_parallel_APK.zip AIRCAT500_V4.01_LivePlay_parallel.apk AIRCAT500_V4.01_LivePlay_SHA256SUMS.txt)
          printf '# AIRCAT500 Mobile v4.01\n\nSource commit: %s\n\nVerified debug APK and checksum in apk/. Physical ESP32 reconnection still requires device testing. Previous versions unchanged.\n' "$SOURCE_SHA" > "$dest/README.md"
          cp "$dest/source/LIVEPLAY_PORT_GR.md" "$dest/CHANGELOG_GR.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$dest"
          git commit -m "Archive verified AIRCAT500 Mobile v4.01 in separate folder"
          git push origin HEAD:main
