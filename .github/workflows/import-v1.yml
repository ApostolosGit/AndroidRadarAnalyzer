name: Import and build AIRCAT500 Mobile v1.0
on:
  push:
    branches: [feature/mobile-v1-desktop-port]
    paths: [".github/aircat_v1_sources.b64"]
  workflow_dispatch:
permissions:
  contents: write

jobs:
  import-v1-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify and unpack Kotlin v1.0 source bundle
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .github/v1parts -name 'part-*.b64' | wc -l)" -eq 8
          cat .github/v1parts/part-*.b64 | base64 --decode > /tmp/aircat-v1.tar.xz
          echo '7fab5aec624fe254a71231bf441d36a8944502c32142a96bd6f2e14fb098eb31  /tmp/aircat-v1.tar.xz' | sha256sum --check
          tar -xJf /tmp/aircat-v1.tar.xz
          rm .github/aircat_v1_sources.b64
          rm -rf .github/v1parts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android unit tests and v1.0 debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIRCAT500-Mobile-v1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish tested readable source files to repository branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md app/build.gradle.kts app/src/main/java/gr/aircat/android app/src/test/java/gr/aircat/android .github/aircat_v1_sources.b64 .github/v1parts
          git commit -m "AIRCAT500 Mobile v1.0: port desktop analyzer diagnostics and replay"
          git push origin HEAD:feature/mobile-v1-desktop-port
